name: Build Cached Docker Image

# Manual run only. Builds and pushes the "-cached" image of an already released version (the base image mongocamp/mongocamp-server:<version> must exist).
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Released version of the base image, e.g. 1.6.0'
        required: true

jobs:
  cached-image:
    runs-on: ubuntu-latest
    steps:
      - name: Git Checkout
        uses: actions/checkout@main
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@master
      - name: Docker login
        run: docker login -u ${{ secrets.DOCKERHUB_USER }} -p ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Build and push the cached image
        run: >
          docker buildx build --platform=linux/amd64
          --build-arg MONGOCAMPVERSION=${{ github.event.inputs.version }}
          --tag mongocamp/mongocamp-server:${{ github.event.inputs.version }}-cached
          -f DockerfileJVMCached --push .

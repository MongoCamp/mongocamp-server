name: Debug Release Setup

# Manual run only. Checks the prerequisites of the release (git access of the token, sbt thin client) without publishing anything.
on:
  workflow_dispatch:

jobs:
  debug-release:
    runs-on: ubuntu-latest
    steps:
      - name: Git Checkout
        uses: actions/checkout@main
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_ADMIN_TOKEN }}
      - name: Set up JDK
        uses: coursier/setup-action@main
        with:
          jvm: graalvm-java21:21.0.2
          apps: sbt scala scalac
      - name: Git access of the token
        env:
          GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
        run: |
          git config --global user.email "ci@mongocamp.dev"
          git config --global user.name "MongoCamp CI"
          echo "--- branch and tracking"; git branch -vv
          echo "--- fetch"; git fetch origin && echo "fetch ok"
          echo "--- push dry run (writes nothing)"; git push --dry-run origin HEAD:main && echo "push dry run ok"
          echo "--- permissions of the token on the repository"
          gh api repos/${{ github.repository }} --jq '.permissions' || echo "gh api failed"
          echo "--- token user"; gh api user --jq '.login' || echo "gh api user failed"
          echo "--- branch protection"; gh api repos/${{ github.repository }}/branches/main --jq '.protected' || true
      - name: sbt thin client options
        # every variant only runs "show version", nothing is built or published
        continue-on-error: true
        run: |
          for variant in "default" "-Dsbt.client=false" "--no-server" "SBT_NATIVE_CLIENT=false"; do
            echo "=== sbt variant: $variant"
            case "$variant" in
              default) sbt "show version" 2>&1 | tail -6 ;;
              SBT_NATIVE_CLIENT=false) SBT_NATIVE_CLIENT=false sbt "show version" 2>&1 | tail -6 ;;
              *) sbt $variant "show version" 2>&1 | tail -6 ;;
            esac
            sbt shutdown >/dev/null 2>&1 || true
          done

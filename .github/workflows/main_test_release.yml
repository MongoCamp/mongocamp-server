name: Run Build and Release Process

on:
  push:
    branches: [ main ]
  repository_dispatch:
    types: [ build ]

env:
  build_latest: auto

jobs:
  #  code_quality:
  #    runs-on: ubuntu-latest
  #    steps:
  #      - name: 'Qodana Scan'
  #        uses: JetBrains/qodana-action@main
  #        env:
  #          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        mongodb-version: [ '4.4', '5.0', '6.0', '7.0', '8.0', '9.0' ]
        os: [ ubuntu-latest ]
    steps:
      - name: Git Checkout
        uses: actions/checkout@main
      - name: Setup TimeZone
        uses: szenius/set-timezone@master
        with:
          timezoneLinux: "Europe/Berlin"
          timezoneMacos: "Europe/Berlin"
          timezoneWindows: "W. Europe Standard Time"
      - name: Set up JDK
        uses: coursier/setup-action@main
        with:
          jvm: graalvm-java25:25.0.2
          apps: sbt scala scalac
      - name: Start MongoDB ${{ matrix.mongodb-version }}
        uses: MongoCamp/mongodb-github-action@main
        with:
          mongodb-version: ${{ matrix.mongodb-version }}
          mongodb-port: 4711
      - name: Run tests
        run: sbt test

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Git Checkout
        uses: actions/checkout@main
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_ADMIN_TOKEN }}
      - id: install-secret-key
        name: Install gpg secret key
        run: cat <(echo -e "${{ secrets.PGP_SECRET_KEY }}") | gpg --batch --import
      - name: Set up JDK
        uses: coursier/setup-action@main
        with:
          jvm: graalvm-java25:25.0.2
          apps: sbt scala scalac
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@master
      - name: Set up QEMU
        uses: docker/setup-qemu-action@master
      - name: Git checks of the release
        # the checks of sbt-release (remote, tracking branch, local changes) with readable output, the thin client of sbt 2 hides their errors
        run: |
          git config --global user.email "ci@mongocamp.dev"
          git config --global user.name "MongoCamp CI"
          echo "--- branch and tracking"; git branch -vv; git rev-parse --abbrev-ref --symbolic-full-name '@{u}' || echo "no upstream configured"
          echo "--- remote"; git remote -v; git ls-remote --heads origin main || echo "ls-remote failed"
          echo "--- local vs remote"; git rev-parse HEAD; git rev-parse origin/main || true; git status -sb | head -5
          echo "--- local changes"; git status --porcelain | head -20
          echo "--- tags"; git tag | wc -l
      - name: Release
        env:
          CONVENTIONAL_GITHUB_RELEASER_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONATYPE_USER: ${{ secrets.SONATYPE_USER }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSWORD }}
          PGP_SECRET: ${{ secrets.PGP_SECRET_KEY }}
        run: |
          docker login -u ${{ secrets.DOCKERHUB_USER }} -p ${{ secrets.DOCKERHUB_PASSWORD }}
          git config --global user.email "ci@mongocamp.dev"
          git config --global user.name "MongoCamp CI"
          sbt ci-release

  sync-readme:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Git Checkout
        uses: actions/checkout@main
        with:
          fetch-depth: 0
      - name: Check out the repo
        uses: meeDamian/sync-readme@master
        with:
          user: ${{ secrets.DOCKERHUB_USER }}
          pass: ${{ secrets.DOCKERHUB_PASSWORD }}
          slug: mongocamp/mongocamp-server
          readme: README.md
          description: true
  vulnerability_scanner:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Run Trivy vulnerability scanner
        if: ${{ env.build_latest == 'auto' }}
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'mongocamp/mongocamp-server:latest'
          format: 'sarif'
          output: 'trivy-results.sarif'
          ignore-unfixed: true

      - name: Upload Trivy scan results to GitHub Security tab
        if: ${{ env.build_latest == 'auto' }}
        uses: github/codeql-action/upload-sarif@main
        with:
          sarif_file: 'trivy-results.sarif'

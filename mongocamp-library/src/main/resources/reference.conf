server {
  interface = "0.0.0.0"
  port = 8080
}

cors {
    origins.allowed = ["http://localhost:8080"]
    headers {
        allowed = ["Authorization", "Content-Type", "X-Requested-With", "X-AUTH-APIKEY"]
        exposed = ["Content-Type", "x-pagination-rows-per-page", "x-pagination-current-page", "x-pagination-count-rows", "x-pagination-count-pages", "x-request-id"]
    }
}

connection {
    host = "localhost"
    port = 27017
    database = "mongocamp"
    username = ""
    password = ""
    authdb = "admin"
}

docs {
    openapi = true
    swagger = false
}

auth {
    handler = "mongo"
    apikeylength = 32

    bearer = true
    token = true
    basic = true
    cache.db = true

    users = ["{}"]
    roles = ["{}"]
    secret = "secret_key"
    expiring.duration = 6h
    refresh.grace.duration = 60s
    grant.denied.status = 401
    prefix = "mc_"
}

file {
    handler = "gridfs"
    cache.age = "7776000"
}

import.max.bytes = 1073741824

aggregation {
    stages.denied = ["$function", "$accumulator", "$where", "$out", "$merge", "$currentOp", "$listSessions", "$collStats", "$indexStats"]
}

plugins {
    directory="/opt/mongocamp/plugins"
    ignored=[]
    modules=[]
    maven.repositories=[]
    urls=[]
}

http.client.headers = "{}"
